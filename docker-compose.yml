services:
  backend:
    build: ./backend
    container_name: control_flota_backend
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
    networks:
      - flota_networks

  db:
    image: postgres:15
    container_name: control_flota_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - flota_networks

  pgadmin:
    image: dpage/pgadmin4
    container_name: control_flota_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE}
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - flota_networks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: control_flota_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    networks:
      - flota_networks

volumes:
  pgdata:
  pgadmin_data:

networks:
  flota_networks:
    driver: bridge
